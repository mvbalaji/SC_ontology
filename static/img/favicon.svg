<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Supply Chain KG">
  <!-- Knowledge-graph glyph: a hub node wired to four satellites. Drawn on a
       filled rounded square so it stays legible against both light and dark
       browser chrome, where a transparent icon would lose its thinner edges. -->
  <rect width="64" height="64" rx="14" fill="#0b1f3b"/>
  <g stroke="#00aeef" stroke-width="3.5" stroke-linecap="round" opacity=".85">
    <line x1="32" y1="32" x2="18" y2="17"/>
    <line x1="32" y1="32" x2="47" y2="19"/>
    <line x1="32" y1="32" x2="17" y2="46"/>
    <line x1="32" y1="32" x2="46" y2="47"/>
  </g>
  <g fill="#00aeef">
    <circle cx="18" cy="17" r="6"/>
    <circle cx="47" cy="19" r="5"/>
    <circle cx="17" cy="46" r="5"/>
    <circle cx="46" cy="47" r="6"/>
  </g>
  <!-- Hub drawn last and in white so it reads as the centre at 16px. -->
  <circle cx="32" cy="32" r="8" fill="#ffffff"/>
</svg>
